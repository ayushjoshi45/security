# Render free web services sleep after ~15 minutes without HTTP traffic.
# This scheduled job sends a lightweight GET so the backend stays reachable.
# Requires GitHub Actions enabled on the repo. Schedule runs in UTC.
#
# Optional: set repository variable RENDER_BACKEND_URL if your Render URL changes
# (Settings → Secrets and variables → Actions → Variables).

name: Render backend keep-alive

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: |
          url="${BACKEND_URL:-https://security-khom.onrender.com/}"
          curl -fsS --max-time 45 "$url"
